[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-bot"
version = "0.1.0"
description = "JEV-powered market decision bot for stocks, crypto and memes. paper by default.: state in, a typed BUY/SELL/HOLD/AVOID out, paper by default"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
jev-bot = "jev_bot.cli:main"

[tool.setuptools]
packages = ["jev_bot", "jev_bot.execution"]
